        const modal = document.getElementById('projectModal');
        const modalContainer = modal.querySelector('.max-w-3xl');
        const mediaContainer = document.getElementById('modalMediaContainer');
        const categoryLabel = document.getElementById('modalCategory');
        const titleLabel = document.getElementById('modalTitle');
        const dynamicBody = document.getElementById('modalDynamicBody');
        const buttonContainer = document.getElementById('modalButtonContainer');
        let currentOpenProjectId = null;

        // Apply language across all static elements dynamically
        function updateDOM() {
            document.querySelectorAll('[data-' + currentLang + ']').forEach(el => {
                el.innerHTML = el.getAttribute('data-' + currentLang);
            });
            document.getElementById('langToggleLabel').textContent = currentLang.toUpperCase() + ' | ' + (currentLang === 'fr' ? 'EN' : 'FR');
        }

        function renderModalContent(projectId) {
            const data = projectData[projectId];
            if (!data) return;
            const langData = data[currentLang] || data['fr'];

            mediaContainer.innerHTML = data.heroMediaHtml || '';
            categoryLabel.textContent = langData.category;
            categoryLabel.className = `text-xs font-bold uppercase tracking-wider ${data.categoryClass || 'text-blue-400'}`;
            titleLabel.textContent = langData.title;
            buttonContainer.innerHTML = langData.buttonHtml || '';
            dynamicBody.innerHTML = langData.bodyHtml || '';

            // Automatically speed up video playback rate in web browser (1.5x speed)
            const activeVideo = mediaContainer.querySelector('video');
            if (activeVideo) {
                activeVideo.playbackRate = 1.5;
            }
        }

        // Language Switcher Function
        function toggleLanguage() {
            currentLang = currentLang === 'fr' ? 'en' : 'fr';
            updateDOM();

            if (currentOpenProjectId) {
                renderModalContent(currentOpenProjectId);
            }
        }

        function openModal(projectId) {
            currentOpenProjectId = projectId;
            renderModalContent(projectId);

            modal.classList.remove('pointer-events-none', 'opacity-0');
            modalContainer.classList.remove('scale-95');
            modalContainer.classList.add('scale-100');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modal.classList.add('pointer-events-none', 'opacity-0');
            modalContainer.classList.remove('scale-100');
            modalContainer.classList.add('scale-95');
            document.body.style.overflow = '';
            currentOpenProjectId = null;

            const activeVideo = mediaContainer.querySelector('video');
            if (activeVideo) activeVideo.pause();
        }

        modal.addEventListener('click', function (e) {
            if (e.target === modal) closeModal();
        });

        window.addEventListener('DOMContentLoaded', () => {
            updateDOM();
        });
    </script>
